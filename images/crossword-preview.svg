<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <rect width="240" height="150" fill="#ece7ff"/>
  <!-- grid: 5 x 22px cells with 2px lines, centered -->
  <g transform="translate(62 17)">
    <rect width="116" height="116" rx="5" fill="#1a1726"/>
    <g fill="#ffffff">
      <rect x="25" y="2" width="21" height="21" rx="2"/>
      <rect x="48" y="2" width="21" height="21" rx="2"/>
      <rect x="71" y="2" width="21" height="21" rx="2"/>
      <rect x="2" y="25" width="21" height="21" rx="2"/>
      <rect x="25" y="25" width="21" height="21" rx="2"/>
      <rect x="48" y="25" width="21" height="21" rx="2"/>
      <rect x="71" y="25" width="21" height="21" rx="2"/>
      <rect x="94" y="25" width="21" height="21" rx="2"/>
      <rect x="2" y="48" width="21" height="21" rx="2"/>
      <rect x="25" y="48" width="21" height="21" rx="2"/>
      <rect x="94" y="48" width="21" height="21" rx="2"/>
      <rect x="2" y="71" width="21" height="21" rx="2"/>
      <rect x="25" y="71" width="21" height="21" rx="2"/>
      <rect x="48" y="71" width="21" height="21" rx="2"/>
      <rect x="71" y="71" width="21" height="21" rx="2"/>
      <rect x="94" y="71" width="21" height="21" rx="2"/>
      <rect x="25" y="94" width="21" height="21" rx="2"/>
      <rect x="48" y="94" width="21" height="21" rx="2"/>
      <rect x="71" y="94" width="21" height="21" rx="2"/>
    </g>
    <!-- highlighted active word and cell -->
    <g fill="#d9cfff">
      <rect x="2" y="48" width="21" height="21" rx="2"/>
      <rect x="25" y="48" width="21" height="21" rx="2"/>
      <rect x="94" y="48" width="21" height="21" rx="2"/>
    </g>
    <rect x="48" y="48" width="21" height="21" rx="2" fill="#a897ff"/>
    <rect x="71" y="48" width="21" height="21" rx="2" fill="#d9cfff"/>
    <rect x="49.5" y="49.5" width="18" height="18" rx="1.5" fill="none" stroke="#5530d9" stroke-width="3"/>
    <!-- clue numbers -->
    <g fill="#555070" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="6" font-weight="700">
      <text x="27" y="9">1</text>
      <text x="50" y="9">2</text>
      <text x="73" y="9">3</text>
      <text x="4" y="32">4</text>
      <text x="96" y="32">5</text>
      <text x="4" y="55">6</text>
      <text x="4" y="78">7</text>
      <text x="27" y="101">8</text>
    </g>
  </g>
</svg>
